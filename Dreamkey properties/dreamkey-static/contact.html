<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DreamKey Properties</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 5rem;
        }

        .contact-info-card {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--warm-gray);
        }

        .info-item {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: var(--bg-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.25rem;
        }

        .contact-form {
            background-color: var(--white);
            padding: 4rem;
            border-radius: 30px;
            box-shadow: var(--shadow-lg);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--warm-gray);
            background: var(--bg-light);
            outline-color: var(--accent);
            font-family: inherit;
        }

        @media (max-width: 991px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .contact-form {
                padding: 1.5rem !important;
                /* Reduced padding for mobile */
            }

            h1 {
                font-size: 2.5rem !important;
            }
        }

        @media (max-width: 768px) {
            .form-row-mobile {
                grid-template-columns: 1fr !important;
                gap: 0;
            }

            .container {
                padding: 0 1rem;
            }
        }

        .form-row-mobile {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body style="background: var(--bg-light);">
    <nav class="navbar"></nav>

                                    Call Us</div>

                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fab fa-instagram"></i></div>
                            <div>
                                <div
                                    style="font-weight: 800; text-transform: uppercase; font-size: 0.75rem; color: var(--text-gray);">
                                    Follow Us</div>
                                <div style="font-weight: 700; font-size: 1.1rem;"><a
                                        href="https://www.instagram.com/dream_key_properties.26?igsh=MXdza3liODI1dzUybQ=="
                                        target="_blank"
                                        style="color: inherit; text-decoration: none;">dream_key_properties.26</a></div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
                            <div>
                                <div
                                    style="font-weight: 800; text-transform: uppercase; font-size: 0.75rem; color: var(--text-gray);">
                                    Our Office</div>
                                <div style="font-weight: 700; font-size: 1.1rem;">Vadavalli, Coimbatore-46</div>
                            </div>
                        </div>

                        <a href="https://wa.me/916382987874" target="_blank" class="btn"

                            <i class="fab fa-whatsapp"></i> Chat on WhatsApp
                        </a>
                    </div>
                </div>

                <div class="contact-form" style="padding: 2.5rem;">
                    <form action="mailto:tamil101731@gmail.com" method="GET">
                        <div class="form-row-mobile">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" name="name" placeholder="John Doe" required>

                                <option>Residential Land</option>
                                <option>General Inquiry</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Your Message</label>
                            <textarea name="body" rows="6" placeholder="Tell us about your requirements..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="js/main.js"></script>
</body>

</html>
