<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | DreamKey Properties</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    <style>
        .property-hero {
            padding-top: 120px;
            background: var(--bg-light);
        }

        .media-hub {
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-lg);
            margin-bottom: 4rem;
        }

        .media-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            padding: 0.5rem;
            gap: 0.5rem;
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .media-tab {
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: var(--transition);
        }

        .media-tab.active {
            background: var(--accent);
            color: var(--primary);
        }

        .image-container,
        .video-container {
            display: none;
            aspect-ratio: 16/9;
            width: 100%;
        }

        .image-container.active,
        .video-container.active {
            display: block;
        }

        .image-slider {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
            /* Default to visible */
            transition: opacity 0.8s ease;
        }

        .slide-container {
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            transition: var(--transition);
        }

        .slider-btn:hover {
            background: var(--accent);
            color: var(--primary);
        }

        .slider-prev {
            left: 1.5rem;
        }

        .slider-next {
            right: 1.5rem;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
        }

        .feature-item {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--warm-gray);
        }

        .amenity-tag {
            display: inline-flex;
            align-items: center;
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            margin: 0 0.8rem 0.8rem 0;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--warm-gray);
        }

        .inquiry-card {
            background: var(--primary);
            color: white;
            padding: 3rem;
            border-radius: 30px;
            position: sticky;
            top: 120px;
            box-shadow: var(--shadow-lg);
        }

        .map-placeholder {
            width: 100%;
            height: 400px;
            background: #e2e8f0;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .details-grid {
                grid-template-columns: 1fr;
            }

            .inquiry-card {
                position: static;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar"></nav>

    <div class="property-hero section-padding">
        <div class="container">
            <div id="property-details">
                <div style="text-align: center; padding: 100px;">Loading property details...</div>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentSlide = 0;

        function moveSlide(direction) {
            const slider = document.getElementById('prop-slider');
            if (!slider) return;
            const totalSlides = slider.children.length;
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function switchMediaTab(type) {
            document.querySelectorAll('.media-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.image-container, .video-container').forEach(view => view.classList.remove('active'));

            if (type === 'images') {
                document.querySelector('.media-tab:nth-child(1)').classList.add('active');
                document.getElementById('image-view').classList.add('active');
            } else {
                document.querySelector('.media-tab:nth-child(2)').classList.add('active');
                document.getElementById('video-view').classList.add('active');
            }
        }

        async function renderProperty(p) {
            const container = document.getElementById('property-details');
            document.title = `${p.title} | DreamKey Properties`;

            // Resolve Media
            const resolvedImages = [];
            for (const img of p.images) {
                resolvedImages.push(await resolveAsset(img));
            }
            const resolvedVideo = p.video ? await resolveAsset(p.video) : null;

            container.innerHTML = `
            <div style="margin-bottom: 3rem;">
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <span class="badge-featured" style="padding: 0.4rem 1.2rem; border-radius: 50px; font-weight: 700; background: var(--accent); color: var(--primary);">${p.type}</span>
                    <span style="background: ${p.status === 'Available' ? '#10b981' : '#f43f5e'}; color: white; padding: 0.4rem 1.2rem; border-radius: 50px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">${p.status}</span>
                </div>
                <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; line-height: 1.1; margin-bottom: 1rem; letter-spacing: -0.02em;">${p.title}</h1>
                <p style="font-size: 1.2rem; color: var(--text-gray); display: flex; align-items: center; gap: 0.8rem;">
                    <i class="fas fa-map-marker-alt" style="color: var(--accent);"></i> ${p.location}
                </p>
            </div>

            <div class="media-hub">
                <div class="media-tabs">
                    <div class="media-tab active" onclick="switchMediaTab('images')">
                        <i class="fas fa-images"></i> Photos
                    </div>
                    ${resolvedVideo ? `<div class="media-tab" onclick="switchMediaTab('videos')"><i class="fas fa-video"></i> Video Tour</div>` : ''}
                </div>

                <div id="image-view" class="image-container active">
                    <div class="slide-container">
                        <button class="slider-btn slider-prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
                        <div id="prop-slider" class="image-slider">
                            ${resolvedImages.map(img => `<img src="${img}" class="slide" onload="this.classList.add('loaded')">`).join('')}
                        </div>
                        <button class="slider-btn slider-next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

                ${resolvedVideo ? `
                <div id="video-view" class="video-container">
                    <div style="width:100%; height:100%;">
                        ${resolvedVideo.toString().includes('youtube.com') || resolvedVideo.toString().includes('youtu.be') ? `
                            <iframe style="width: 100%; height: 100%; border:0;" src="${resolvedVideo.toString().replace('watch?v=', 'embed/')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        ` : `
                            <video style="width: 100%; height: 100%; object-fit: contain;" controls>
                                <source src="${resolvedVideo}" type="video/mp4">
                            </video>
                        `}
                    </div>
                </div>` : ''}
            </div>

            <div class="details-grid">
                <div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 4rem;">
                        ${p.type !== 'Land' ? `
                        <div class="feature-item">
                            <i class="fas fa-bed" style="color: var(--accent); font-size: 1.8rem;"></i>
                            <div><div style="font-weight: 900; font-size: 1.2rem;">${p.bedrooms || 0}</div><div style="font-size: 0.85rem; color: var(--text-gray);">Bedrooms</div></div>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-bath" style="color: var(--accent); font-size: 1.8rem;"></i>
                            <div><div style="font-weight: 900; font-size: 1.2rem;">${p.bathrooms || 0}</div><div style="font-size: 0.85rem; color: var(--text-gray);">Bathrooms</div></div>
                        </div>` : ''}
                        <div class="feature-item">
                            <i class="fas fa-vector-square" style="color: var(--accent); font-size: 1.8rem;"></i>
                            <div><div style="font-weight: 900; font-size: 1.2rem;">${p.area}</div><div style="font-size: 0.85rem; color: var(--text-gray);">Total Sqft</div></div>
                        </div>
                    </div>

                    <div style="margin-bottom: 3rem;">
                        <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Description</h3>
                        <p style="color: var(--text-gray); font-size: 1.1rem; line-height: 1.8;">${p.description}</p>
                    </div>

                    <div style="margin-bottom: 3rem;">
                        <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Amenities</h3>
                        <div>
                            ${p.amenities.map(a => `<span class="amenity-tag"><i class="fas fa-check-circle" style="color: var(--accent); margin-right: 8px;"></i> ${a}</span>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="inquiry-card">
                        <div style="margin-bottom: 2rem;">
                            <div style="color: rgba(255,255,255,0.6); font-size: 0.85rem; text-transform: uppercase;">Price</div>
                            <div style="font-size: 2.5rem; font-weight: 800; color: var(--accent);">${formatPrice(p.price)}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <a href="https://wa.me/916382987874?text=Hi, I am interested in ${p.title}" target="_blank" class="btn" style="background: #25d366; color: white;">WhatsApp Inquiry</a>
                            <a href="https://www.instagram.com/dream_key_properties.26" target="_blank" class="btn" style="background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: white;">Instagram DM</a>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('property-details');

            if (!slug) {
                container.innerHTML = '<div style="text-align: center; padding: 100px;"><h2>Property not found.</h2></div>';
                return;
            }

            try {
                console.log("Fetching property for slug:", slug);
                const p = await getPropertyBySlug(slug);
                console.log("Property data received:", p);

                if (!p) {
                    console.error("No property found for slug:", slug);
                    container.innerHTML = '<div style="text-align: center; padding: 100px;"><h2>Property not found.</h2><p>Slug: ' + slug + '</p></div>';
                    return;
                }
                await renderProperty(p);
            } catch (err) {
                console.error("Critical load failure:", err);
                container.innerHTML = '<div style="text-align: center; padding: 100px;"><h2>Failed to load data.</h2><p>' + err.message + '</p></div>';
            }
        });
    </script>
</body>

</html>
