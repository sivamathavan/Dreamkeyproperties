<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Listings | DreamKey Properties</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    <style>
        .listings-header {
            background-color: var(--primary);
            padding: 150px 0 100px;
            color: var(--white);
            text-align: center;
        }

        .filter-bar {
            background: var(--white);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            margin-top: -50px;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            border: 1px solid var(--warm-gray);
        }

        .filter-item {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }

        .filter-item label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 0.5rem;
        }

        .filter-item select,
        .filter-item input {
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--warm-gray);
            font-weight: 600;
            outline-color: var(--accent);
        }
    </style>
</head>

<body style="background-color: var(--bg-light);">
    <nav class="navbar"></nav>

    <header class="listings-header">
        <div class="container">
            <span class="section-tag" style="color: rgba(255,255,255,0.6);">Explore Inventory</span>
            <h1 style="font-size: 3.5rem; font-weight: 800;">Our <span style="color: var(--accent);">Properties</span>
            </h1>
            <p style="opacity: 0.7; max-width: 600px; margin: 1rem auto;">Wide range of premium houses, flats, and land.
                Filter to find your perfect match.</p>
        </div>
    </header>

    <div class="container" style="position: relative; z-index: 10;">
        <div class="filter-bar">
            <div class="filter-item">
                <label>Property Type</label>
                <select id="filter-type">
                    <option value="All">All Types</option>
                    <option value="House">Houses</option>
                    <option value="Flat">Flats</option>
                    <option value="Land">Land</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Status</label>
                <select id="filter-status">
                    <option value="All">All Status</option>
                    <option value="Available">Available</option>
                    <option value="Sold">Sold</option>
                    <option value="UnderConstruction">Under Construction</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Max Price (₹)</label>
                <input type="number" id="filter-price" placeholder="E.g. 50,00,000">
            </div>
            <div class="filter-item" style="justify-content: flex-end;">
                <button class="btn btn-primary" onclick="applyFilters()" style="padding: 0.8rem;">Apply Filters</button>
            </div>
        </div>
    </div>

    <section class="section-padding">
        <div class="container">
            <div id="results-meta" style="margin-bottom: 2rem; color: var(--text-gray); font-weight: 600;">
                Showing <span id="count">0</span> properties
            </div>
            <div id="listings-grid" class="properties-grid">
                <!-- Injected via JS -->
            </div>
            <div id="no-results" style="display: none; text-align: center; padding: 100px 0;">
                <i class="fas fa-search" style="font-size: 4rem; color: var(--warm-gray); margin-bottom: 2rem;"></i>
                <h2>No properties found</h2>
                <p>Try adjusting your search filters.</p>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const grid = document.getElementById('listings-grid');
        const countSpan = document.getElementById('count');
        const noResults = document.getElementById('no-results');

        async function renderListings(filteredList) {
            grid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 2rem;">Loading properties...</div>';

            if (filteredList.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                countSpan.innerText = '0';
                return;
            }

            const cards = [];
            for (const p of filteredList) {
                cards.push(await createPropertyCard(p));
            }

            grid.innerHTML = cards.join('');
            noResults.style.display = 'none';
            countSpan.innerText = filteredList.length;
        }

        async function applyFilters() {
            const type = document.getElementById('filter-type').value;
            const status = document.getElementById('filter-status').value;
            const maxPrice = document.getElementById('filter-price').value;

            let filtered = await fetchProperties();

            if (type !== 'All') {
                filtered = filtered.filter(p => p.type === type);
            }
            if (status !== 'All') {
                filtered = filtered.filter(p => p.status === status);
            }
            if (maxPrice) {
                filtered = filtered.filter(p => p.price <= parseInt(maxPrice));
            }

            renderListings(filtered);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const initialData = await fetchProperties();
            renderListings(initialData);
        });
    </script>
</body>

</html>
